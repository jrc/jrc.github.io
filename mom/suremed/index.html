<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Dynamic status bar color for iOS 15 -->
    <meta id="theme-color" name="theme-color" content="#f2f2f7">

    <title>Day of Week</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        html {
            transition: background-color 0.3s ease;
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Standard Day Mode */
        html.day-mode {
            background-color: #f2f2f7;
        }

        body.day-mode {
            color: #1c1c1e;
        }

        /* Night Mode (Empty black screen) */
        html.night-mode {
            background-color: #000000;
        }

        body.night-mode .container {
            display: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vmin;
            text-align: center;
        }

        /* "Take your medicine" reminder element */
        .reminder {
            font-size: 5.5vmin;
            /* font-weight: 700; */
            /* letter-spacing: 0.03em; */
            /* text-transform: uppercase; */
            line-height: 1;
            margin-bottom: 2vmin;
            /* Color class will be dynamically applied via JS to match the period */
        }

        /* Short Day (e.g., WED) */
        .day {
            font-size: 22vmin;
            font-weight: 700;
            line-height: 1;
            /* letter-spacing: 0.05em; */
            transition: color 0.3s ease;
        }

        /* Icon Container */
        .icon {
            font-size: 20vmin;
            line-height: 1;
            color: #3a3a3c;
        }

        /* Date (e.g., 07/15) */
        .date {
            font-size: 18vmin;
            font-weight: 600;
            line-height: 1;
            transition: color 0.3s ease;
        }

        /* Extra dimmed state for Noon/Evening */
        .dimmed {
            color: #aeaeb2;
        }

        /* Time of Day Label */
        .period {
            font-size: 12vmin;
            font-weight: 700;
            /* letter-spacing: 0.05em; */
        }

        /* Blister Pack Colors */
        .morning-color {
            color: #d96a29;
        }

        .noon-color {
            color: #2f8e65;
        }

        .evening-color {
            color: #66448c;
        }

        .bedtime-color {
            color: #2a4b8d;
        }
    </style>
</head>

<body class="day-mode">
    <div class="container">
        <!-- 0. Medical Reminder Banner -->
        <div id="reminder-display" class="reminder"></div>

        <!-- 1. Day of Week -->
        <div id="day-display" class="day"></div>

        <!-- 2. Text Icon -->
        <div id="icon-display" class="icon"></div>

        <!-- 3. Date -->
        <div id="date-display" class="date"></div>

        <!-- 4. Period Label -->
        <div id="period-display" class="period"></div>
    </div>

    <script>
        const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

        const reminderDisplay = document.getElementById('reminder-display');
        const dayDisplay = document.getElementById('day-display');
        const dateDisplay = document.getElementById('date-display');
        const periodDisplay = document.getElementById('period-display');
        const iconDisplay = document.getElementById('icon-display');
        const themeColorMeta = document.getElementById('theme-color');
        const rootElement = document.documentElement;

        function updateDisplay() {
            const now = new Date();
            const currentHour = now.getHours();

            // Night Mode Bound: Midnight (00:00) until before 7:00 AM
            if (currentHour >= 0 && currentHour < 7) {
                rootElement.className = "night-mode";
                document.body.className = "night-mode";
                themeColorMeta.setAttribute("content", "#000000");
            } else {
                rootElement.className = "day-mode";
                document.body.className = "day-mode";
                themeColorMeta.setAttribute("content", "#f2f2f7");

                dayDisplay.textContent = days[now.getDay()];

                const month = String(now.getMonth() + 1).padStart(2, '0');
                const date = String(now.getDate()).padStart(2, '0');
                dateDisplay.textContent = `${month}/${date}`;

                // Default clear states
                dayDisplay.className = "day";
                dateDisplay.className = "date";
                iconDisplay.style.visibility = "hidden";
                iconDisplay.innerHTML = "&nbsp;";

                // Reset reminder tracking classes
                reminderDisplay.className = "reminder";
                reminderDisplay.style.visibility = "hidden";
                reminderDisplay.innerHTML = "&nbsp;";

                // Period Logic
                if (currentHour >= 7 && currentHour < 11) {  // 4 hr
                    // Morning: 7:00 AM to 10:59 AM
                    periodDisplay.textContent = "MORNING";
                    periodDisplay.className = "period morning-color";

                    iconDisplay.innerHTML = "&#x2600;&#xFE0E;";
                    iconDisplay.style.visibility = "visible";

                    // Show Reminder in matching morning orange
                    reminderDisplay.textContent = "Take your medicine!";
                    reminderDisplay.classList.add("morning-color");
                    reminderDisplay.style.visibility = "visible";
                }
                else if (currentHour >= 11 && currentHour < 16) {  // 5 hr
                    // Noon: 11:00 AM to 3:59 PM
                    periodDisplay.textContent = "NOON";
                    periodDisplay.className = "period noon-color";

                    dayDisplay.classList.add("dimmed");
                    dateDisplay.classList.add("dimmed");
                }
                else if (currentHour >= 16 && currentHour < 21) {  // 5 hr
                    // Evening: 4:00 PM to 8:59 PM
                    periodDisplay.textContent = "EVENING";
                    periodDisplay.className = "period evening-color";

                    dayDisplay.classList.add("dimmed");
                    dateDisplay.classList.add("dimmed");
                }
                else if (currentHour >= 21 && currentHour <= 23) { // 3 hr
                    // Bedtime: 9:00 PM up to 11:59 PM
                    periodDisplay.textContent = "BEDTIME";
                    periodDisplay.className = "period bedtime-color";

                    iconDisplay.innerHTML = "&#x263E;&#xFE0E;";
                    iconDisplay.style.visibility = "visible";

                    // Show Reminder in matching bedtime blue
                    reminderDisplay.textContent = "Take your medicine!";
                    reminderDisplay.classList.add("bedtime-color");
                    reminderDisplay.style.visibility = "visible";
                }
            }
        }

        function scheduleNextUpdate() {
            const now = new Date();
            const nextHour = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate(),
                now.getHours() + 1,
                0, 0, 0
            );
            const delayUntilNextHour = nextHour.getTime() - now.getTime();

            setTimeout(() => {
                updateDisplay();
                scheduleNextUpdate();
            }, delayUntilNextHour);
        }

        updateDisplay();
        scheduleNextUpdate();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateDisplay();
            }
        });
    </script>
</body>

</html>
