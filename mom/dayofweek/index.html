<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Day of Week</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Today">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            /* Smooth background transition when night mode kicks in/out */
            transition: background-color 0.3s ease;

            /* Center everything perfectly in a vertical column */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

            /* Modern system UI font spacing */
            font-family: system-ui, -apple-system, sans-serif;

            /* Prevents accidental text highlighting */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Standard Day Mode Themes */
        body.day-mode {
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        /* "Today is" helper text (Mixed Case) - Slightly Larger */
        .label {
            font-size: 6vw;
            font-weight: 400;
            color: #3a3a3c;
            margin-bottom: 1vh;
        }

        /* Massive main day text (Force Uppercase) - Slightly Larger */
        .day {
            font-size: 32vw;
            font-weight: 600;
            line-height: 1;
            text-transform: uppercase;
        }

        /* Night Mode Theme (Empty black screen) */
        body.night-mode {
            background-color: #000000;
        }

        body.night-mode .label,
        body.night-mode .day {
            display: none;
            /* Entirely hides the text elements */
        }
    </style>
</head>

<body class="day-mode">
    <div class="label">Today is</div>
    <div id="day-display" class="day"></div>

    <script>
        const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const display = document.getElementById('day-display');

        function updateDisplay() {
            const now = new Date();
            const currentHour = now.getHours();

            // Night Mode Condition: Hour is >= 22 (10 PM) OR < 7 (6:59 AM)
            if (currentHour >= 22 || currentHour < 7) {
                document.body.className = "night-mode";
            } else {
                document.body.className = "day-mode";
                display.textContent = days[now.getDay()];
            }
        }

        function scheduleNextUpdate() {
            const now = new Date();
            const nextHour = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate(),
                now.getHours() + 1,
                0, 0, 0
            );
            const delayUntilNextHour = nextHour.getTime() - now.getTime();

            setTimeout(() => {
                updateDisplay();
                scheduleNextUpdate();
            }, delayUntilNextHour);
        }

        // Initialize on page load
        updateDisplay();
        scheduleNextUpdate();

        // Instantly updates when phone wakes up / Safari becomes active
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateDisplay();
            }
        });
    </script>
</body>

</html>
