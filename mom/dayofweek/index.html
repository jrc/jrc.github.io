<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Day of Week</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        /* Apply background to HTML to prevent edge bleed on iOS */
        html {
            transition: background-color 0.3s ease;
            height: 100%;
        }

        body {
            /* Center everything perfectly in a vertical column */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

            /* Modern system UI font spacing */
            font-family: system-ui, -apple-system, sans-serif;

            /* Prevents accidental text highlighting */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Standard Day Mode Themes */
        html.day-mode {
            background-color: #f2f2f7;
        }

        body.day-mode {
            color: #1c1c1e;
        }

        /* "Today is" helper text */
        .label {
            font-size: 6vw;
            font-weight: 400;
            color: #3a3a3c;
            margin-bottom: 1vh;
        }

        /* Massive main day text */
        .day {
            font-size: 32vw;
            font-weight: 600;
            line-height: 1;
            text-transform: uppercase;
        }

        /* Night Mode Theme (Empty black screen) */
        html.night-mode {
            background-color: #000000;
        }

        .night-mode .label,
        .night-mode .day {
            display: none;
            /* Entirely hides the text elements */
        }
    </style>
</head>

<body class="day-mode">
    <div class="label">Today is</div>
    <div id="day-display" class="day"></div>

    <script>
        const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const display = document.getElementById('day-display');
        const themeColorMeta = document.getElementById('theme-color');
        const rootElement = document.documentElement; // The <html> tag
        const bodyElement = document.body;

        function updateDisplay() {
            const now = new Date();
            const currentHour = now.getHours();

            // Night Mode: >= 22 (10 PM) OR <= 6 (6:59 AM)
            if (currentHour >= 22 || currentHour <= 6) {
                rootElement.className = "night-mode";
                bodyElement.className = "night-mode";
                themeColorMeta.setAttribute("content", "#000000"); // Turns status bar black
            } else {
                rootElement.className = "day-mode";
                bodyElement.className = "day-mode";
                display.textContent = days[now.getDay()];
                themeColorMeta.setAttribute("content", "#f2f2f7"); // Turns status bar grey
            }
        }

        function scheduleNextUpdate() {
            const now = new Date();
            const nextHour = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate(),
                now.getHours() + 1,
                0, 0, 0
            );
            const delayUntilNextHour = nextHour.getTime() - now.getTime();

            setTimeout(() => {
                updateDisplay();
                scheduleNextUpdate();
            }, delayUntilNextHour);
        }

        // Initialize on page load
        updateDisplay();
        scheduleNextUpdate();

        // Instantly updates when phone wakes up
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateDisplay();
            }
        });
    </script>
</body>

</html>
